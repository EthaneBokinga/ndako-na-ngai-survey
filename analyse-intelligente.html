<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Intelligente Ndako na Ngai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-50" id="root"></body>

<script>
// Cette page n'inclut pas de clés en dur - elle utilise firebase-config.js présent dans le projet.
// Le fichier `firebase-config.js` doit initialiser firebase et exposer `window.firebaseDB`.

// On importe firebase-config.js dynamiquement (déjà présent dans le projet)
(function loadConfig(){
    const s = document.createElement('script');
    s.src = 'firebase-config.js';
    s.defer = true;
    document.head.appendChild(s);
})();

let D = { r: [], s: {}, f: [], d: [], e: [], rel: [], mvp: {} };
let tab = 'resume';

async function launch(){
    render();
    try{
        // Attendre un court instant si firebase-config.js est en train d'initialiser
        await new Promise(res=>setTimeout(res, 300));

        const db = window.firebaseDB || (typeof firebase !== 'undefined' ? firebase.firestore() : null);
        const auth = window.firebaseAuth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);

        // Si les règles Firestore sont strictes, on peut tenter une connexion anonyme (dev only)
        if(auth && !auth.currentUser){
            try{
                await auth.signInAnonymously();
                console.log('Connexion anonyme réussie');
            }catch(e){
                console.warn('Impossible de se connecter anonymement', e);
            }
        }
        if(!db){
            alert('Firebase non configuré ou indisponible. Vérifiez `firebase-config.js`.');
            return;
        }

        // Essayer plusieurs noms de collections (compatibilité avec admin)
        const tryCollections = ['survey_responses','surveys','responses'];
        let snap = null;
        for(const col of tryCollections){
            try{
                const q = await db.collection(col).get();
                if(q && q.docs && q.docs.length){ snap = q; console.log('Loaded from', col); break; }
            }catch(e){ console.warn('Erreur lecture collection', col, e); }
        }
        // Si aucune collection trouvée, tenter la première comme fallback
        if(!snap){
            try{
                snap = await db.collection(tryCollections[0]).get();
            }catch(e){
                console.error('Lecture fallback échouée:', e);
                if(e && e.code === 'permission-denied'){
                    alert('Accès Firestore refusé (règles de sécurité). Pour tester :\n• Autorisez la lecture pour la collection dans la console Firebase (temporaire), ou\n• Activez l\'authentification anonyme et rechargez.\nVoir la console pour plus de détails.');
                } else {
                    alert('Erreur lecture Firestore: '+(e && e.message?e.message:String(e)));
                }
                throw e;
            }
        }

        D.r = snap.docs.map(d=>({ id: d.id, ...d.data() }));

        // Stats
        const v = {}, b = { a:0, b:0, c:0, d:0, e:0 };
        D.r.forEach(r=>{
            if(r.ville || r.city) {
                const city = r.ville || r.city;
                v[city] = (v[city]||0) + 1;
            }
            if(r.budget){
                const n = parseInt(String(r.budget).replace(/\D/g,''));
                if(n<50000) b.a++; else if(n<=100000) b.b++; else if(n<=200000) b.c++; else if(n<=500000) b.d++; else b.e++;
            }
        });
        D.s = { total: D.r.length, villes: Object.keys(v).length, budgets: b };

        // Fonctionnalités
        const fc = {};
        D.r.forEach(r=>{
            if(r.fonctionnalites || r.features){
                const arr = r.fonctionnalites || r.features;
                (Array.isArray(arr)?arr:[arr]).forEach(f=>{ if(f) fc[f] = (fc[f]||0)+1; });
            }
        });
        D.f = Object.entries(fc).map(([n,c])=>({ name:n, count:c, pct: Math.round(c/D.r.length*100), pri: c>D.r.length*0.5?'HAUTE':'MOYENNE' })).sort((a,b)=>b.count-a.count);

        // Difficultés
        const dc = {};
        D.r.forEach(r=>{
            if(r.difficultes || r.problems){
                const arr = r.difficultes || r.problems;
                (Array.isArray(arr)?arr:[arr]).forEach(d=>{ if(d) dc[d] = (dc[d]||0)+1; });
            }
        });
        D.d = Object.entries(dc).map(([n,c])=>({ name:n, count:c, pct: Math.round(c/D.r.length*100) })).sort((a,b)=>b.count-a.count);

        // Entités & relations enrichies pour une application immobilière complète (libellés FR)
        D.e = [
            { n: 'Administrateur', i: '🛡️', c: 'slate', a: ['id, nom, email, rôle', 'permissions, actif'] },
            { n: 'Propriétaire', i: '🏘️', c: 'blue', a: ['id, nom, contact, vérifié', 'propriétés: [propertyId...]'] },
            { n: 'Démarcheur', i: '👔', c: 'violet', a: ['id, nom, agence, note, commission', 'disponibilité'] },
            { n: 'Client', i: '👥', c: 'teal', a: ['id, nom, contact, préférences', 'recherchesSauvegardées, favoris'] },
            { n: 'Annonceur', i: '📣', c: 'amber', a: ['id, entreprise, méthodesPaiement, campagnes'] },
            { n: 'Propriété', i: '🏠', c: 'purple', a: ['id, titre, type, prix, superficie', 'ville, quartier, latitude, longitude', 'proprietaireId, statut, photos[]'] },
            { n: 'Photo', i: '📸', c: 'pink', a: ['id, propertyId, url, isPrincipal, uploadedBy'] },
            { n: 'Visite', i: '📅', c: 'lime', a: ['id, propertyId, userId, agentId, date, statut, notes'] },
            { n: 'Message', i: '💬', c: 'cyan', a: ['id, senderId, receiverId, contenu, lu', 'createdAt'] },
            { n: 'Vérification', i: '✅', c: 'green', a: ['id, entityId, type, statut, documents[]'] },
            { n: 'Paiement', i: '💰', c: 'yellow', a: ['id, userId, propertyId, montant, méthode, statut'] },
            { n: 'Favori', i: '❤️', c: 'red', a: ['id, userId, propertyId'] },
            { n: 'Recherche', i: '🔍', c: 'teal', a: ['id, userId, critères, sauvegardée'] },
            { n: 'Notification', i: '🔔', c: 'orange', a: ['id, userId, type, contenu, lu'] },
            { n: 'Contrat', i: '📄', c: 'rose', a: ['id, propertyId, proprietaireId, locataireId, montant, dateDebut, dateFin'] },
            { n: 'Évaluation', i: '⭐', c: 'amber', a: ['id, propertyId, userId, note, commentaire'] },
            { n: 'DonnéesHorsLigne', i: '📱', c: 'slate', a: ['id, userId, data, lastSync'] }
        ];

        D.rel = [
            { f: 'Propriétaire', t: 'Propriété', ty: '1:N', d: 'possède' },
            { f: 'Propriété', t: 'Photo', ty: '1:N', d: 'contient' },
            { f: 'Démarcheur', t: 'Visite', ty: '1:N', d: 'organise' },
            { f: 'Client', t: 'Favori', ty: '1:N', d: 'ajoute' },
            { f: 'Annonceur', t: 'Propriété', ty: 'N:M', d: 'promeut' },
            { f: 'Administrateur', t: 'Propriétaire', ty: '1:N', d: 'gère / modère' },
            { f: 'Client', t: 'Message', ty: '1:N', d: 'envoie' },
            { f: 'Propriété', t: 'Contrat', ty: '1:1', d: 'peut avoir' }
        ];

        D.mvp = { p: [
            { num: 1, nom: 'Authentification, Fondations & Admin', sem: '3-4', pri: 'CRITIQUE', feat: ['Authentification (email/anonyme/SSO)', 'Rôles & Permissions', 'Tableau de bord admin', 'Modèles Firestore'], scr: ['ÉcranLogin', 'AdminDashboard'] },
            { num: 2, nom: 'Gestion des annonces', sem: '4-6', pri: 'CRITIQUE', feat: ['CRUD Propriétés', 'Téléversement photos', 'Géolocalisation & Cartes', 'Recherche & Filtres', 'Flux propriétaire'], scr: ['ListePropriétés', 'DétailPropriété', 'AjouterPropriété'] },
            { num: 3, nom: 'Interactions', sem: '3-4', pri: 'HAUTE', feat: ['Messagerie intégrée', 'RDV/Visites', 'Avis & Notations', 'Outils de modération'], scr: ['Chat', 'PlanificateurVisite', 'ÉcranAvis'] },
            { num: 4, nom: 'Monétisation & Sécurité', sem: '4-6', pri: 'HAUTE', feat: ['Paiements & Reçus', 'Espace annonceurs', 'Bannissement & sanctions', 'Vérification KYC'], scr: ['ÉcranPaiement','PanneauAnnonceur','PanneauModération'] },
            { num: 5, nom: 'Avancé & Scalabilité', sem: '4-6', pri: 'MOYENNE', feat: ['Synchronisation hors-ligne', 'Recherche IA & recommandations', 'Visites virtuelles (360)', 'Analytics & reporting'], scr: ['SyncService','RecommandationsIA','VisiteVirtuelle'] }
        ] };

        render();
    }catch(e){
        alert('Erreur: '+(e && e.message ? e.message : String(e)));
        render();
    }
}

function render(){
    const root = document.getElementById('root');
    if(!D.r.length){
        root.innerHTML = `
            <div class="min-h-screen p-6">
                <div class="max-w-6xl mx-auto">
                    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl shadow-2xl p-8 text-white text-center">
                        <h1 class="text-5xl font-bold mb-4">🧠 Analyseur Intelligent</h1>
                        <p class="text-xl mb-6 opacity-90">Ndako na Ngai - Analyse automatique complète</p>
                        <button onclick="launch()" class="bg-white text-indigo-600 px-10 py-4 rounded-xl font-bold text-xl hover:bg-gray-100 shadow-lg">
                            🚀 Lancer l'Analyse
                        </button>
                    </div>
                </div>
            </div>
        `;
        return;
    }

    const tabs = [ ['resume','📊 Résumé'], ['reponses','📝 Réponses'], ['entites', `🗄️ Entités (${D.e.length})`], ['relations','🔗 Relations'], ['mvp','🎯 MVP'], ['scenario','🗺️ Scénario'], ['code','💻 Code'] ];

    root.innerHTML = `
        <div class="min-h-screen p-4">
            <div class="max-w-7xl mx-auto">
                <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl p-6 mb-4 text-white flex justify-between items-center">
                    <div>
                        <h1 class="text-3xl font-bold">Analyse Terminée ✅</h1>
                        <p>${D.s.total} réponses • ${D.s.villes} villes • ${D.e.length} entités</p>
                    </div>
                    <div style="display:flex;gap:12px;align-items:center">
                        <button onclick="window.location.href='admin.html'" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-bold">← Retour Admin</button>
                        <button onclick="location.reload()" class="bg-white text-indigo-600 px-6 py-3 rounded-lg font-bold">🔄 Recharger</button>
                    </div>
                </div>
                <div class="bg-white rounded-xl shadow-lg mb-4">
                    <div class="flex border-b overflow-x-auto">
                        ${tabs.map(([id,lbl])=>`<button onclick="tab='${id}';render()" class="flex-1 px-6 py-3 font-bold ${tab===id?'border-b-4 border-indigo-600 text-indigo-600':'text-gray-500'}">${lbl}</button>`).join('')}
                    </div>
                </div>
                <div>${getContent()}</div>
            </div>
        </div>
    `;
}

function getContent(){
    if(tab==='resume'){
        return `
            <div class="grid grid-cols-4 gap-4 mb-4">
                <div class="bg-blue-500 text-white rounded-xl p-6"><div class="text-4xl font-bold">${D.s.total}</div><div>Réponses</div></div>
                <div class="bg-purple-500 text-white rounded-xl p-6"><div class="text-4xl font-bold">${D.s.villes}</div><div>Villes</div></div>
                <div class="bg-pink-500 text-white rounded-xl p-6"><div class="text-4xl font-bold">${D.e.length}</div><div>Entités</div></div>
                <div class="bg-green-500 text-white rounded-xl p-6"><div class="text-4xl font-bold">${D.mvp.p.length}</div><div>Phases MVP</div></div>
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6 mb-4">
                <h3 class="text-2xl font-bold mb-4">🎯 Top Fonctionnalités</h3>
                ${D.f.slice(0,6).map(f=>`<div class="mb-3"><div class="flex justify-between mb-1"><span>${f.name}</span><span>${f.pct}%</span></div><div class="bg-gray-200 rounded-full h-4"><div class="bg-${f.pri==='HAUTE'?'red':'blue'}-500 h-4 rounded-full" style="width:${f.pct}%"></div></div></div>`).join('')}
            </div>
            <div class="bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-2xl font-bold mb-4">⚠️ Difficultés</h3>
                <div class="grid grid-cols-3 gap-4">
                    ${D.d.slice(0,6).map(d=>`<div class="bg-red-50 p-4 rounded-lg border-l-4 border-red-500"><div class="text-2xl font-bold text-red-600">${d.pct}%</div><div class="text-sm">${d.name}</div></div>`).join('')}
                </div>
            </div>
        `;
    }
    if(tab==='entites'){
        return `<div class="grid grid-cols-3 gap-4">${D.e.map(e=>`<div class="bg-white rounded-xl shadow-lg overflow-hidden"><div class="bg-${e.c}-500 text-white p-4 flex items-center gap-3"><span class="text-3xl">${e.i}</span><h3 class="text-xl font-bold">${e.n}</h3></div><div class="p-4 bg-gray-50 text-xs">${e.a.map(a=>`<div class="mb-1">• ${a}</div>`).join('')}</div></div>`).join('')}</div>`;
    }
    if(tab==='reponses'){
        // Affiche les réponses brutes, commentaires et photos trouvés
        const rows = D.r.map((r,i)=>{
            const d = r;
            const comment = d.commentaire || d.comment || d.demarcheurComments || d.comments || '';
            const photos = d.photos || d.photoUrls || d.images || (d.photos_list?d.photos_list:[]);
            const ts = d._ts || d.ts || 0;
            const date = ts ? new Date(ts).toLocaleString('fr-FR') : '—';
            return `<div class="bg-white rounded-xl shadow p-4 mb-4">
                <div class="flex justify-between items-center mb-2"><strong>#${i+1}</strong><small>${date}</small></div>
                <div class="text-sm text-gray-700 mb-2">Ville: ${(d.city||d.ville||'—')}</div>
                ${comment?`<div class="mb-2"><strong>Commentaire:</strong><div class="p-2 bg-gray-50 rounded">${comment}</div></div>`:''}
                ${Array.isArray(photos) && photos.length ? `<div class="mb-2"><strong>Photos:</strong><div style=\"display:flex;gap:8px;flex-wrap:wrap\">${photos.map(p=>`<img src="${p}" style="width:140px;height:90px;object-fit:cover;border-radius:8px;border:1px solid #eee"/>`).join('')}</div></div>`:''}
            </div>`;
        }).join('');
        return `<div><h3 class="text-2xl font-bold mb-4">Toutes les réponses</h3>${rows || '<div>Aucune réponse trouvée.</div>'}</div>`;
    }
    if(tab==='relations'){
        return `<div class="bg-white rounded-xl shadow-lg p-6"><h2 class="text-2xl font-bold mb-4">🔗 Relations</h2>${D.rel.map(r=>`<div class="bg-blue-50 rounded-lg p-4 mb-3"><div class="flex items-center gap-4"><div class="bg-blue-500 text-white px-4 py-2 rounded font-bold">${r.f}</div><div class="flex-1 border-t-2 border-dashed"></div><span class="bg-white px-3 py-1 rounded-full font-bold text-sm">${r.ty}</span><div class="flex-1 border-t-2 border-dashed"></div><div class="bg-purple-500 text-white px-4 py-2 rounded font-bold">${r.t}</div></div><div class="mt-2 text-sm text-gray-600">→ ${r.d}</div></div>`).join('')}</div>`;
    }
    if(tab==='mvp'){
        return `<div class="bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-xl p-6 mb-4"><h2 class="text-3xl font-bold">🎯 Feuille de route MVP</h2><p class="opacity-90">${D.mvp.p.reduce((s,p)=>s + parseInt(String(p.sem).split('-')[1]||p.sem),0)} semaines total</p></div>${D.mvp.p.map(p=>`<div class="bg-white rounded-xl shadow-lg p-6 mb-4"><div class="flex justify-between mb-4"><div><h3 class="text-2xl font-bold">Phase ${p.num} - ${p.nom}</h3><span class="inline-block bg-${p.pri==='CRITIQUE'?'red':'yellow'}-100 text-${p.pri==='CRITIQUE'?'red':'yellow'}-700 px-3 py-1 rounded-full text-sm font-bold mt-2">${p.pri}</span></div><div class="text-right"><div class="text-3xl font-bold">${p.sem}</div><div class="text-sm text-gray-600">semaines</div></div></div><div class="grid grid-cols-2 gap-3 mb-4">${p.feat.map(f=>`<div class="bg-gray-50 p-3 rounded flex items-start gap-2"><span class="text-green-500">✓</span><span class="text-sm">${f}</span></div>`).join('')}</div><div><strong>Écrans:</strong> ${p.scr.join(', ')}</div></div>`).join('')}`;
    }
    if(tab==='scenario'){
        // Scénario étape‑par‑étape pour réaliser l'application
        return (
            '<div class="bg-white rounded-xl shadow-lg p-6">'
            + '<h2 class="text-2xl font-bold mb-4">🗺️ Scénario de réalisation - Étapes</h2>'
            + '<ol class="list-decimal ml-6 space-y-4 text-gray-700">'
            + '<li><strong>Définir l\'architecture et les entités</strong> — valider les collections Firestore : users, admins, owners, properties, photos, visits, messages, payments, ads, verifications et leurs indexes.</li>'
            + '<li><strong>Auth & Admin</strong> — mettre en place Firebase Auth, rôles (admin), panneau d\'administration et outils de modération (bannissement, signalement).</li>'
            + '<li><strong>CRUD Propriétés</strong> — création, édition, suppression par propriétaire; upload photos, géolocalisation et affichage sur carte.</li>'
            + '<li><strong>Interactions</strong> — messagerie in-app, demande de visite, planning et notifications; système de notes/commentaires pour propriétaires et démarcheurs.</li>'
            + '<li><strong>Sécurité & Vérification</strong> — KYC/verification des propriétaires, modération des annonces, sanctions (suspension/licenciement).</li>'
            + '<li><strong>Monétisation</strong> — espace annonceurs, campagnes sponsorisées, paiements et reçus.</li>'
            + '<li><strong>MVP & test</strong> — tests utilisateurs, collecte de feedbacks, itérations sur features prioritaires (search, photo quality, offline).</li>'
            + '<li><strong>Scale</strong> — analytics, recommandations IA, optimisation offline sync et tours virtuels.</li>'
            + '</ol>'
            + '<div class="mt-6 text-sm text-gray-600">Remarque: chaque étape inclut des tâches QA, sécurité et index Firestore nécessaires.</div>'
            + '</div>'
        );
    }
    if(tab==='code'){
        return `<div class="bg-white rounded-xl shadow-lg p-6"><h2 class="text-2xl font-bold mb-4">💻 Architecture Flutter</h2><div class="mb-6"><h3 class="text-xl font-bold mb-2">📁 Structure Projet</h3><pre class="bg-gray-900 text-gray-100 p-4 rounded text-sm">lib/\n├── core/\n├── features/\n└── shared/</pre></div></div>`;
    }
    return '';
}
</script>
</script>
<script>
// Affiche l'UI initiale dès que le DOM est prêt
document.addEventListener('DOMContentLoaded', function(){
    try{ render(); }catch(e){ console.warn('Render failed on load', e); }
});
</script>
</html>
